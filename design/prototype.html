function radar(c){const center=[150,116],r=78;const point=(i,v)=>[center[0]+Math.sin(i*Math.PI/2)*r*v/100,center[1]-Math.cos(i*Math.PI/2)*r*v/100].map(v=>v.toFixed(1)).join(',');return `<svg class="chart" viewBox="0 0 300 232" role="img" aria-label="${c.name}四维雷达图：${c.scores.map((v,i)=>dims[i]+v+'分').join('，')}">${[20,40,60,80,100].map(v=>`<polygon points="${dims.map((_,i)=>point(i,v)).join(' ')}" fill="none" stroke="rgba(44,24,16,.12)" stroke-width=".8"/>`).join('')}${dims.map((_,i)=>`<line x1="150" y1="116" x2="${point(i,100).split(',')[0]}" y2="${point(i,100).split(',')[1]}" stroke="rgba(44,24,16,.12)"/>`).join('')}<polygon points="${c.scores.map((v,i)=>point(i,v)).join(' ')}" fill="#c0392b" fill-opacity=".1" stroke="#c0392b" stroke-width="1.8"/>${c.scores.map((v,i)=>`<circle cx="${point(i,v).split(',')[0]}" cy="${point(i,v).split(',')[1]}" r="3.3" fill="${colors[i]}"/>`).join('')}<text x="150" y="20" text-anchor="middle">心理 ${c.scores[0]}</text><text x="252" y="120" text-anchor="middle">美育 ${c.scores[1]}</text><text x="150" y="218" text-anchor="middle">财商 ${c.scores[2]}</text><text x="45" y="120" text-anchor="middle">行为 ${c.scores[3]}</text><text class="axis" x="157" y="83">40</text><text class="axis" x="157" y="52">80</text></svg>`}
function chartHistory(c){return [0,1,2,3].map(i=>c.scores.map((v,d)=>Math.max(0,Math.min(100,v-([8,6,4,0][i])+(d===0&&i===2?5:0)))))}
function trend(c){const vals=chartHistory(c).map(v=>v[dimension]);const xx=[35,117,199,281],yy=v=>145-v*1.2;return `<div class="row" style="gap:2px">${dims.map((d,i)=>`<button class="dim-button ${dimension===i?'active':''}" data-dim="${i}" style="color:${i===2?'var(--ink)':colors[i]}"><span class="dot" style="background:${colors[i]}"></span>${d}</button>`).join('')}</div><svg class="chart" viewBox="0 0 310 170" role="img" aria-label="${dims[dimension]}近四期趋势：${vals.join('、')}分">${[0,50,100].map(v=>`<line x1="35" y1="${yy(v)}" x2="285" y2="${yy(v)}" stroke="rgba(44,24,16,.12)" stroke-dasharray="3 4"/><text class="axis" x="24" y="${yy(v)+3}" text-anchor="end">${v}</text>`).join('')}<polyline points="${vals.map((v,i)=>xx[i]+','+yy(v)).join(' ')}" fill="none" stroke="${colors[dimension]}" stroke-width="2.4"/>${vals.map((v,i)=>`<g role="button" tabindex="0" data-point="${i}" aria-label="2026年${i+7}月 ${v}分" style="cursor:pointer"><circle cx="${xx[i]}" cy="${yy(v)}" r="15" fill="transparent"/><circle cx="${xx[i]}" cy="${yy(v)}" r="4" fill="#fdf8f0" stroke="${colors[dimension]}" stroke-width="2"/><text class="axis" x="${xx[i]}" y="166" text-anchor="middle">${i+7}月</text></g>`).join('')}</svg><div class="point-note" id="point-note">点击节点查看周期分数 · 0–100 分</div>`}
const tabsVolunteer=[['pairs','sprout','我的结对'],['poems','book','成长诗'],['logs','pencil','记录'],['profile','user','我的']],tabsAdmin=[['overview','grid','总览'],['children','sprout','孩子'],['volunteers','users','志愿者'],['adminProfile','user','我的']];
function go(page,opts={}){if(taskTimer){clearTimeout(taskTimer);taskTimer=null}if(current==='newlog')saveDraft();if(!opts.back&&page!==current)history.push({page:current,role,kidId,poemId,logId,volId});current=page;if(meta[page][1]!=='both')role=meta[page][1];if(opts.kid)kidId=opts.kid;if(opts.poem)poemId=Number(opts.poem);if(opts.log)logId=Number(opts.log);if(opts.vol)volId=opts.vol;state='normal';filter='all';query='';render();location.hash=page;}

="${related?'poem':'generate'}" ${related?'data-poem="'+related.id+'"':''}><div class="row"><div style="color:var(--deep)">${icon('book')}</div><div class="grow"><div class="person-title" style="font-size:15px">${related?'读一首属于'+c.name+'的成长诗':'为这段成长写一首诗'}</div><div class="small">${related?related.title:'从真实记录中，拾起小小的光'}</div></div>${icon('arrow')}</div></button><div class="section"><div class="section-head"><h2>陪伴的足迹</h2>${role==='volunteer'?'<button class="text-btn" data-go="newlog">记一次陪伴 '+icon('plus')+'</button>':''}</div><div class="timeline">${records.map(l=>`<div class="timeline-item"><span class="small">${l.date} · ${l.type}</span><h3>${l.type==='活动'?'一起做秋叶拼贴':l.type==='通话'?'聊聊校园生活':'一起读绘本'}</h3><p>${l.content.slice(0,36)}…</p><button class="text-btn" data-go="logdetail" data-log="${l.id}">查看记录 ${icon('arrow')}</button></div>`).join('')||'<p class="small">还没有陪伴记录。</p>'}</div></div>`},

share(){let x=p();return `<div class="row between" style="margin-bottom:16px"><div><h2 style="font-size:17px">成长诗分享卡</h2><p class="small">一份温柔的成长纪念</p></div><span class="tag">匿名分享</span></div><div class="share-paper" id="share-paper"><div class="poem-cover">${landscape(x.id%2)}</div><div class="poem-reading"><div class="eyebrow" id="share-name">给正在长大的你</div><h1>${x.title}</h1><div class="verse">${x.verse}</div></div><div class="share-bottom"><div><strong class="serif" style="font-size:16px">拾光育苗</strong><div class="small">成长有迹，心自成诗</div><div style="font-size:10px;color:var(--muted)">AI 生成诗文 · 封面设计示意</div></div><div class="brand-stamp">拾光<br>育苗</div></div></div><label class="tiny-check"><input type="checkbox" id="show-name">在卡片上显示孩子昵称（分享前确认授权）</label><div class="small" style="margin-top:12px">原型保存为 SVG 设计图；正式版生成 PNG 后调用微信相册保存。</div>`},
logs(){let list=logs.filter(l=>myKids().some(c=>c.id===l.kid)&&(filter==='all'||l.kid===filter));return `<div class="section-head" style="margin-bottom:16px"><div><h1 style="font-size:24px">陪伴的足迹</h1><p class="small">每一次认真倾听，都有回响。</p></div><button class="btn compact" data-go="newlog">${icon('plus')}新增</button></div>${chipBar([['all','全部'],...myKids().map(c=>[c.id,c.name])])}<div class="stack">${list.map(recordCard).join('')||noResults()}</div>`},
newlog(){return `<div class="field"><label class="form-label" for="log-kid">陪伴对象</label><select id="log-kid">${myKids().map(c=>`<option value="${c.id}" ${c.id===(draft.kid||kidId)?'selected':''}>${c.name} · ${c.grade}</option>`).join('')}</select></div><div class="field"><div class="form-label">陪伴方式</div><div class="choice-grid">${[['探访','heart'],['通话','phone'],['活动','leaf'],['其他','pencil']].map(([name,ic])=>`<button class="choice ${draft.type===name?'active':''}" data-type="${name}">${icon(ic)}${name}</button>`).join('')}</div></div><div class="field"><label class="form-label" for="log-content">这次陪伴，发生了什么</label><textarea id="log-content" maxlength="1000" placeholder="可以记录一起做的事、孩子的表达，以及下次想继续的事。">${escapeHtml(draft.content)}</textarea><div class="row between field-hint"><span>记录具体观察，少下结论。</span><span id="char-count">${draft.content.length}/1000</span></div><p class="form-error" id="log-error" role="alert">请至少写下 10 个字的陪伴观察。</p></div><div class="field"><div class="row between"><span class="form-label">添加图片（选填）</span><span class="small" id="image-count">${imageUrls.length}/3</span></div><div class="upload-grid" id="uploads">${uploads()}</div><p class="field-hint">最多 3 张，每张不超过 5MB。避免上传可识别身份的照片。</p></div><div class="notice">${icon('shield')}记录仅对有权限的志愿者与管理者可见。首次使用应先完成隐私告知与必要授权。</div>`},
logdetail(){let l=logs.find(x=>x.id===logId)||logs[0],c=kids.find(x=>x.id===l.kid);return `<div class="card"><div class="row"><div class="avatar ${c.tone}">${c.name.slice(-1)}</div><div class="grow"><div class="person-title">与${c.name}的一次${l.type}</div><div class="small">${l.date} · 林知夏</div></div><span class="tag">${l.type}</span></div><div class="body-copy">${escapeHtml(l.content)}</div>${l.images?.length?`<div class="upload-grid" style="margin-top:20px">${l.images.map((src,i)=>`<button class="upload-thumb" data-action="preview-image" data-src="${src}" aria-label="查看图片 ${i+1}"><img src="${src}" alt="陪伴记录图片"></button>`).join('')}</div>`:l.image?`<button style="width:100%;padding:0" data-action="art-preview"><div class="thumb-art" style="height:180px">${landscape()}</div></button>`:''}</div><div class="notice">${icon('shield')}这是陪伴的观察记录，用于后续跟进，不作为孩子的诊断或评价。</div>`},
profile(){return `<div class="profile-hero"><div class="row"><div class="avatar large">林</div><div><h1>林知夏</h1><p class="small">青溪志愿服务队</p><span class="tag">${icon('sprout')}结对志愿者</span></div></div><div class="summary-grid"><div><b>${myKids().length}</b><span>结对孩子</span></div><div><b>${logs.filter(l=>myKids().some(c=>c.id===l.kid)).length}</b><span>陪伴记录</span></div><div><b>${poems.filter(x=>myKids().some(c=>c.id===x.kid)).length}</b><span>成长诗</span></div></div></div><div class="card section">${menuRow('user','志愿者信息','profile-info')}${menuRow('link','结对管理','pairing',true)}${menuRow('pencil','我的陪伴记录','logs',true)}</div><div class="card section">${menuRow('shield','隐私与信息保护','privacy')}${menuRow('help','使用帮助与反馈','help')}${menuRow('sprout','关于拾光育苗','about')}</div><div class="version"><span class="serif" style="font-size:15px;color:var(--deep)">成长有迹，心自成诗</span><br>心迹成诗 · 拾光系 / v1.0</div>`},
pairing(){return `<h1 style="font-size:24px">我陪伴着的孩子</h1><p class="small" style="margin-top:8px">${myKids().length} 段结对关系，每一步都值得认真。</p><div class="notice">${icon('link')}结对分配由组织管理者负责。如需调整，请联系你的组织负责人。</div><div class="stack">${myKids().map(c=>childCard(c)).join('')||noResults()}</div>`},
overview(){let avg=Math.round(kids.reduce((n,c)=>n+overall(c),0)/kids.length),alerts=kids.filter(urgent),unpaired=kids.filter(c=>!c.vol);return `<div class="intro"><div><div class="eyebrow">青溪服务计划 / 管理视角</div><h1>让每一份陪伴有回应</h1><p>最新观察周期 2026 年 10 月</p></div><div class="seal">成长<br>有迹</div></div><div class="metric-grid">${[['孩子总数',kids.length,'人','已纳入成长档案'],['志愿者',volunteers.length,'人','参与结对陪伴'],['平均观察分',avg,'分','基于最新四维均值'],['需跟进孩子',alerts.length,'人','至少一维低于 60 分']].map((x,i)=>`<div class="card metric"><div class="label">${x[0]}</div><div class="value" style="color:${i===3?'var(--deep)':'var(--ink)'}">${x[1]}<span class="unit">${x[2]}</span></div><div class="trend ${i===3?'red':''}">${x[3]}</div></div>`).join('')}</div><div class="section card"><div class="section-head"><h2>预警汇总</h2><button class="text-btn" data-go="alerts">全部 ${icon('arrow')}</button></div>${alerts.map(c=>`<button class="list-row" data-go="detail" data-kid="${c.id}"><div class="avatar ${c.tone}" style="width:36px;height:36px;font-size:17px">${c.name.slice(-1)}</div><div class="grow"><strong>${c.name}</strong><div class="small">${c.focus} · ${c.vol||'未结对'}</div></div><span class="tag warn">${c.scores.some(v=>v<40)?'高危信号':'预警信号'}</span></button>`).join('')}</div><div class="section card"><div class="section-head"><h2>综合等级分布</h2><span class="small">${kids.length} 位孩子</span></div>${['优秀','关注','预警','高危'].map((lv,i)=>{let n=kids.filter(c=>level(c)===lv).length;return `<div class="dist-row"><span>${lv}</span><div class="dist-track"><b style="width:${n/kids.length*100}%;background:${['#2d7d46','#d4a74a','#c0392b','#8b1a1a'][i]}"></b></div><span style="text-align:right">${n}人 · ${n/kids.length*100}%</span></div>`}).join('')}<p class="small">综合等级由最新四维均值决定；单维预警单独统计，不与等级分布混算。</p></div><button class="card tap section" data-go="assign"><div class="row"><div style="color:var(--deep)">${icon('link')}</div><div class="grow"><strong>还有 ${unpaired.length} 位孩子等待结对</strong><div class="small">为陪伴安排一位同行的人</div></div>${icon('arrow')}</div></button><div class="small" style="margin-top:20px;text-align:center">演示数据 · 5 位孩子与 3 位志愿者</div>`},
alerts(){let cs=kids.filter(urgent).filter(c=>filter==='all'||(filter==='danger'?c.scores.some(v=>v<40):!c.scores.some(v=>v<40)));return `<h1 style="font-size:24px;margin-bottom:8px">先回应需要关注的变化</h1><p class="small" style="margin-bottom:20px">提醒用于安排人工跟进，不直接判断孩子的状态。</p>${chipBar([['all','全部'],['danger','高危信号'],['warning','预警信号']])}<div class="stack">${cs.map(c=>`<div class="card"><div class="row between"><div><div class="person-title">${c.name} <span class="small">${c.grade}</span></div><div class="small">${c.school} · 2026-10</div></div><span class="tag warn">${c.scores.some(v=>v<40)?'优先人工跟进':'安排跟进'}</span></div>${c.scores.map((v,i)=>v<60?`<div class="action-summary"><span class="dot" style="background:${colors[i]}"></span>${dims[i]} ${v} /100 · ${v<40?'高危':'预警'}阈值<br>结对人：${c.vol||'未分配'}</div>`:'').join('')}<button class="btn secondary full" style="margin-top:16px" data-go="detail" data-kid="${c.id}">查看档案与跟进建议</button></div>`).join('')||noResults()}</div>`},
children(){let cs=kids.filter(c=>(filter==='all'||(filter==='urgent'&&urgent(c))||(filter==='unpaired'&&!c.vol))&&(`${c.name}${c.school}${c.grade}${c.vol||''}`).includes(query));return `${searchBox('搜索昵称、学校或年级')}${chipBar([['all','全部 '+kids.length],['urgent','需跟进 '+kids.filter(urgent).length],['unpaired','未结对 '+kids.filter(c=>!c.vol).length]])}<div class="stack" id="search-results">${cs.map(c=>childCard(c,true)).join('')||noResults()}</div>`},
volunteers(){let vs=volunteers.filter(v=>(v.name+v.org).includes(query));return `${searchBox('搜索志愿者或组织')}<div class="section-head"><h2>同行的志愿者</h2><button class="btn compact" data-go="assign">${icon('link')}分配结对</button></div><div class="stack" id="search-results">${vs.map(v=>`<button class="card tap" data-go="volunteer" data-vol="${v.id}"><div class="row"><div class="avatar">${v.initial}</div><div class="grow"><div class="person-title">${v.name}</div><div class="small">${v.org}</div></div><span class="tag">${kids.filter(c=>c.vol===v.name).length} 位结对</span></div><div class="card-footer"><span>在岗 · 可查看结对与调整</span>${icon('arrow')}</div></button>`).join('')||noResults()}</div>`},
volunteer(){let v=volunteers.find(x=>x.id===volId)||volunteers[0],cs=kids.filter(c=>c.vol===v.name);return `<div class="card"><div class="row"><div class="avatar large">${v.initial}</div><div><h1 style="font-size:22px">${v.name}</h1><p class="small">${v.org}</p><span class="tag good">在岗志愿者</span></div></div><div class="info-table"><div><span class="muted">结对孩子</span><strong>${cs.length} 人</strong></div><div><span class="muted">数据范围</span><span>仅本人结对孩子</span></div></div></div><div class="section-head section"><h2>当前结对</h2><button class="text-btn" data-go="assign">新增结对 ${icon('plus')}</button></div><div class="stack">${cs.map(c=>`<div class="card"><div class="row"><div class="grow"><strong>${c.name}</strong><div class="small">${c.grade} · ${c.school}</div></div><button class="text-btn" data-go="detail" data-kid="${c.id}">档案 ${icon('arrow')}</button></div><div class="card-footer"><span>结对关系 · 服务中</span><button class="text-btn" data-action="unpair" data-kid="${c.id}">解除结对</button></div></div>`).join('')||noResults()}</div><div class="notice">${icon('shield')}结对变动会改变志愿者的数据访问范围，操作前请核对对象。</div>`},
assign(){let unpaired=kids.filter(c=>!c.vol);return `<h1 style="font-size:24px">安排下一段陪伴</h1><p class="small" style="margin:8px 0 24px">选择志愿者，为等待结对的孩子安排陪伴。</p><div class="field"><label class="form-label" for="assign-vol">结对志愿者</label><select id="assign-vol">${volunteers.map(v=>`<option value="${v.id}" ${volId===v.id?'selected':''}>${v.name} · 已结对 ${kids.filter(c=>c.vol===v.name).length} 人</option>`).join('')}</select></div><div class="field"><span class="form-label">选择孩子</span><div class="card select-list">${unpaired.length?unpaired.map((c,i)=>`<label class="check-row"><input type="radio" name="assign-kid" value="${c.id}" ${c.id===(assignKid||unpaired[0]?.id)?'checked':''}><div class="grow"><strong>${c.name}</strong><div class="small">${c.grade} · ${c.school}</div></div><span class="tag">未结对</span></label>`).join(''):'<p class="small">当前所有孩子均已结对。</p>'}</div></div><div class="action-summary" id="assign-summary">${unpaired.length?'将为 '+(kids.find(c=>c.id===assignKid)||unpaired[0]).name+' 分配一位主陪伴者。':'没有待分配对象。'}</div><p class="form-error" id="assign-error" role="alert"></p><div class="notice">${icon('link')}提交前将再次确认对象。演示默认每位孩子一名主陪伴者，实际结对数量规则由后端决定。</div>`},
adminProfile(){return `<div class="profile-hero"><div class="row"><div class="avatar large">青</div><div><h1>青溪项目管理</h1><p class="small">青溪志愿服务队</p><span class="tag">${icon('shield')}管理角色</span></div></div><div class="info-table"><div><span class="muted">可见范围</span><strong>全部孩子与志愿者</strong></div><div><span class="muted">管理职责</span><span>结对分配 · 预警跟进</span></div></div></div><div class="card section">${menuRow('link','结对分配','assign',true)}${menuRow('users','志愿者管理','volunteers',true)}${menuRow('alert','预警汇总','alerts',true)}</div><div class="card section">${menuRow('shield','隐私与信息保护','privacy')}${menuRow('help','使用帮助与反馈','help')}${menuRow('sprout','关于拾光育苗','about')}</div><button class="btn secondary full section" data-action="logout">退出登录</button><div class="version">心迹成诗 · 拾光系 / v1.0<br>角色由服务器授权，不允许前端自行升权。</div>`}
};
function recordCard(l){let c=kids.find(c=>c.id===l.kid);return `<button class="card tap" data-go="logdetail" data-log="${l.id}" data-kid="${l.kid}"><div class="row between"><div class="record-title">与${c.name}的一次${l.type}</div><span class="tag">${l.type}</span></div><p class="record-body">${escapeHtml(l.content)}</p>${l.images?.length?`<div class="upload-grid" style="margin-top:12px">${l.images.map(src=>`<div class="upload-thumb"><img src="${src}" alt="陪伴记录图片"></div>`).join('')}</div>`:l.image?'<div class="thumb-art">'+landscape()+'</div>':''}<div class="card-footer"><span>${l.date} · 林知夏</span>${icon('arrow')}</div></button>`}
function menuRow(ic,text,target,route=false){return `<button class="list-row" ${route?'data-go':'data-action'}="${target}">${icon(ic)}<span class="grow">${text}</span>${icon('arrow','arrow')}</button>`}
function basis(id,period){let c=kids.find(x=>x.id===id),scores=period==='2026-09'?chartHistory(c)[2]:c.scores;return `${c.name} · ${period}<br>心理 ${scores[0]} / 美育 ${scores[1]} / 财商 ${scores[2]} / 行为 ${scores[3]}<br>${period==='2026-09'?'近期足迹：尝试用画画表达想法。':id==='a'?'近期足迹：主动选择落叶，尝试介绍自己的拼贴作品。':'近期足迹：认真表达自己的想法，尝试参与新的活动。'}`} 
function uploads(){return imageUrls.map((src,i)=>`<div class="upload-thumb"><img src="${src}" alt="待上传图片 ${i+1}"><button class="remove-image" data-remove="${i}" aria-label="删除图片 ${i+1}">${icon('close')}</button></div>`).join('')+(imageUrls.length<3?`<button class="upload" data-action="upload">${icon('plus')}添加图片</button>`:'')}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const empties={pairs:['还没有结对的孩子','联系组织管理者，安排你的第一段陪伴。','查看结对说明','pairing'],detail:['这段成长，等待记录','还没有可用的成长观察。陪伴记录可以先留下来。','返回孩子列表','back'],advice:['还需要一点成长的线索','有了成长观察与陪伴记录，建议会更贴近孩子。','查看成长档案','detail'],poems:['第一首成长诗，等你写下','从一次真实的陪伴开始，拾起孩子的小小变化。','写一首成长诗','generate'],poem:['这首诗还没有生成','选择孩子与已有观察周期，开始写诗。','生成成长诗','generate'],generate:['还没有可用的成长观察','请联系管理者补充成长观察，再生成成长诗。','返回成长诗','poems'],share:['分享卡还没有准备好','先生成并阅读成长诗，再制作分享卡。','返回阅读','poem'],logs:['陪伴的第一页，等你写下','记一段对话，或一次一起完成的小事。','记一次陪伴','newlog'],newlog:['先有一段结对，再留下足迹','当前没有可选择的结对孩子，请联系组织管理者。','查看结对说明','pairing'],logdetail:['这条记录暂时不可用','记录可能已被移除或不在当前权限范围内。','返回记录列表','logs'],profile:['还未完成志愿者资料','登录后补充昵称与组织信息，开始陪伴。','查看资料说明','profile-info'],pairing:['还没有结对关系','请联系组织管理者安排结对。','返回我的','profile'],overview:['成长计划，从第一份档案开始','尚未录入孩子与观察数据。请先在帮扶后台建立档案。','查看数据接入说明','help'],alerts:['当前没有需要跟进的预警','继续做好日常陪伴，留意具体变化。','查看全部孩子','children'],children:['还没有孩子档案','在心迹成诗后台建立档案后，这里将同步显示。','查看数据接入说明','help'],volunteers:['还没有志愿者加入','志愿者登录后会加入服务计划。','查看使用帮助','help'],volunteer:['当前没有结对的孩子','为这位志愿者安排一段新的陪伴。','分配结对','assign'],assign:['所有孩子都有了陪伴者','暂时没有待分配对象，可在志愿者详情调整结对。','查看志愿者','volunteers'],adminProfile:['管理资料暂未完善','请联系项目负责人补充组织资料。','查看使用帮助','help']};
function stateView(){if(state==='loading')return `<div class="small" style="margin-bottom:20px">正在载入${meta[current][0]}…</div>${[0,1,2].map(()=>'<div class="sk-card"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton" style="width:75%"></div><div class="skeleton" style="width:90%;height:32px"></div></div>').join('')}`;if(state==='error')return `<div class="empty">${emptyArt('error')}<h2>${['newlog','assign','generate'].includes(current)?'暂时未能提交':'暂时没能加载出来'}</h2><p>${['newlog','assign','generate'].includes(current)?'已保留填写与选择，请检查网络后重试。':'网络可能暂时断开，请检查连接后重试。'}</p><button class="btn" data-action="retry">${icon('refresh')}重试</button><button class="text-btn" style="margin:12px auto" data-action="back">返回上一页</button></div>`;const [title,copy,cta,target]=empties[current];return `<div class="empty">${emptyArt()}<h2>${title}</h2><p>${copy}</p><button class="btn" ${target in pages?'data-go':'data-action'}="${target}">${cta}</button></div>`}
function bindForm(){const search=$('#search');if(search)search.addEventListener('input',e=>{query=e.target.value;let temp=document.createElement('div');temp.innerHTML=pages[current]();$('#search-results').innerHTML=temp.querySelector('#search-results').innerHTML});const txt=$('#log-content');if(txt)txt.addEventListener('input',()=>{draft.content=txt.value;$('#char-count').textContent=txt.value.length+'/1000';$('#log-error').style.display='none'});if($('#log-kid'))$('#log-kid').addEventListener('change',e=>draft.kid=e.target.value);if($('#poem-kid'))$('#poem-kid').addEventListener('change',e=>{kidId=e.target.value;$('#basis .poem-basis').innerHTML=basis(kidId,$('#poem-period').value)});if($('#poem-period'))$('#poem-period').addEventListener('change',e=>{selectedPeriod=e.target.value;$('#basis .poem-basis').innerHTML=basis($('#poem-kid').value,selectedPeriod)});if($('#assign-vol'))$('#assign-vol').addEventListener('change',e=>volId=e.target.value);document.querySelectorAll('input[name="assign-kid"]').forEach(r=>r.addEventListener('change',e=>{assignKid=e.target.value;$('#assign-summary').textContent='将为 '+kids.find(c=>c.id===assignKid).name+' 分配一位主陪伴者。'}));if($('#show-name'))$('#show-name').addEventListener('change',e=>$('#share-name').textContent=e.target.checked?'写给'+kids.find(c=>c.id===p().kid).name:'给正在长大的你');}
function saveDraft(){if($('#log-content'))draft.content=$('#log-content').value;if($('#log-kid'))draft.kid=$('#log-kid').value;}
function toast(msg){clearTimeout(toastTimer);$('#overlay').innerHTML=`<div class="toast" role="status">${escapeHtml(msg)}</div>`;toastTimer=setTimeout(()=>$('#overlay').innerHTML='',1800)}
function modal(title,copy,onConfirm,confirmLabel='确认'){clearTimeout(toastTimer);$('#overlay').innerHTML=`<div class="modal-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title">${title}</h2><p>${escapeHtml(copy)}</p><div class="modal-actions">${onConfirm?'<button class="btn secondary" id="modal-cancel">取消</button>':''}<button class="btn" id="modal-confirm">${onConfirm?confirmLabel:'知道了'}</button></div></div></div>`;const previousFocus=document.activeElement;$('#modal-confirm').focus();const close=()=>{$('#overlay').innerHTML='';if(previousFocus?.isConnected)previousFocus.focus()};$('#modal-confirm').onclick=()=>{close();if(onConfirm)onConfirm()};if($('#modal-cancel'))$('#modal-cancel').onclick=close;$('.modal-overlay').onkeydown=e=>{if(e.key==='Escape'){close();return}if(e.key==='Tab'){const btns=[...$('.modal').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===btns[0]){e.preventDefault();btns[btns.length-1].focus()}else if(!e.shiftKey&&document.activeElement===btns[btns.length-1]){e.preventDefault();btns[0].focus()}}};}
function action(name,el){switch(name){case 'back':back();break;case 'retry':state='normal';render();break;case 'clear-filter':filter='all';query='';render();break;case 'copy':{let text=$('#opener').textContent;navigator.clipboard?.writeText(text).then(()=>toast('开场话术已复制')).catch(()=>modal('开场话术',text));if(!navigator.clipboard)modal('开场话术',text);break}case 'regenerate':{const btn=el;btn.disabled=true;btn.innerHTML=icon('refresh','spin')+'正在整理陪伴建议';taskTimer=setTimeout(()=>{btn.disabled=false;btn.innerHTML=icon('refresh')+'重新生成建议';toast('已更新演示建议 · 未调用 AI 服务');taskTimer=null},1400);break}case 'upload':$('#image-input').click();break;case 'submit-log':submitLog();break;case 'generate-poem':generatePoem();break;case 'assign':assignPair();break;case 'unpair':{const c=kids.find(x=>x.id===el.dataset.kid);modal('确认解除结对？',`将解除 ${c.vol} 与 ${c.name} 的结对关系。志愿者将失去对该孩子的访问权限。`,()=>{c.vol=null;render();toast('已解除结对（仅演示数据）')},'解除结对');break}case 'download':downloadShare();break;case 'profile-info':modal('志愿者信息','昵称：林知夏\n组织：青溪志愿服务队\n资料更正请联系组织管理员。原型未接入资料修改接口。');break;case 'privacy':modal('隐私与信息保护','仅在结对授权范围内读取孩子档案。分享卡默认匿名，记录照片不进入公开分享。\n正式版需展示完整隐私协议、未成年人信息处理说明及授权记录。');break;case 'help':modal('使用帮助与反馈','志愿者：从我的结对进入档案，查看建议，再记录陪伴。\n管理：查看预警并在志愿者详情安排结对。\n档案与成长观察在心迹成诗后台录入。反馈入口待组织提供实际联系方式。');break;case 'about':modal('拾光育苗','心迹成诗的志愿者陪伴助手。\n成长有迹，心自成诗。\n当前为 UI 设计原型，全部身份与数据均为虚构示例。');break;case 'logout':modal('退出登录','正式版退出会清除会话与本地敏感缓存。此原型不含真实登录。');break;case 'contact':modal('跟进联系人',`结对志愿者：${k().vol||'待分配'}\n请通过组织已授权的沟通渠道跟进。\n当前接口未提供联系人电话，原型不模拟拨号。`);break;case 'art-preview':modal('图片预览','记录中的插画为设计示意，正式版使用 wx.previewImage 预览陪伴图片。');break;case 'preview-image':{modal('陪伴图片预览','');$('.modal p').innerHTML=`<img src="${el.dataset.src}" alt="陪伴记录图片预览" style="width:100%;max-height:420px;object-fit:contain;border-radius:10px">`;break}}}
function submitLog(){saveDraft();if(draft.content.trim().length<10){$('#log-error').style.display='block';$('#log-content').style.borderColor='var(--red)';$('#log-content').focus();return}const button=$('[data-action="submit-log"]');button.disabled=true;button.textContent='正在保存…';taskTimer=setTimeout(()=>{const now=new Date();logs.unshift({id:Date.now(),kid:draft.kid,type:draft.type,date:now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0'),content:draft.content.trim(),images:[...imageUrls]});imageUrls=[];draft={kid:kidId,type:'活动',content:''};taskTimer=null;go('logs');toast('陪伴记录已保存（本次演示会话）')},900)}
function generatePoem(){const id=$('#poem-kid').value,period=$('#poem-period').value;const c=kids.find(c=>c.id===id);$('#page').innerHTML=`<div class="card progress-card">${icon('star','spin')}<h2>正在拾起成长的片段</h2><p class="small">根据${c.name}的 ${period} 记录整理诗文…<br>这是原型中的生成演示。</p><div class="progress-line"><b></b></div><button class="text-btn" style="margin:16px auto 0" data-action="back">返回上一页</button></div>`;$('#bottom').innerHTML='<div class="home-safe"></div>';taskTimer=setTimeout(()=>{let base=poems[0];const x={...base,id:Date.now(),kid:id,period,date:'刚刚',title:'把小小的光，种进秋天'};poems.unshift(x);poemId=x.id;kidId=id;taskTimer=null;go('poem');toast('成长诗已生成（示例诗文）')},1800)}
function assignPair(){const selected=$('input[name="assign-kid"]:checked');if(!selected){$('#assign-error').textContent='请先选择一个未结对的孩子。';$('#assign-error').style.display='block';return}let c=kids.find(x=>x.id===selected.value),v=volunteers.find(x=>x.id===$('#assign-vol').value);modal('确认这段结对',`${v.name} 将成为 ${c.name} 的主陪伴者，并获得该孩子档案的访问权限。`,()=>{c.vol=v.name;volId=v.id;assignKid=null;go('volunteer');toast('结对分配完成（仅演示数据）')},'确认分配')}
function downloadShare(){const x=p(),show=$('#show-name')?.checked;let verse=x.verse.split('\n'),title=x.title.length>11?[x.title.slice(0,8),x.title.slice(8)]:[x.title];let titleY=250,verseY=titleY+title.length*42+20;let xml=`<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1420" viewBox="0 0 375 710"><rect width="375" height="710" fill="#fdf8f0"/>${landscape(x.id%2).replace('<svg viewBox','<svg y="0" width="375" height="195" viewBox')}<text x="30" y="220" fill="#8b1a1a" font-size="11" font-family="Microsoft YaHei">${show?'写给'+kids.find(c=>c.id===x.kid).name:'给正在长大的你'}</text>${title.map((line,i)=>`<text x="30" y="${titleY+i*42}" fill="#2c1810" font-family="SimSun,serif" font-size="24">${escapeHtml(line)}</text>`).join('')}${verse.map((line,i)=>`<text x="30" y="${verseY+i*29}" fill="#2c1810" font-family="SimSun,serif" font-size="16">${escapeHtml(line)}</text>`).join('')}<path d="M30 628h315" stroke="#e8d5a0"/><text x="30" y="655" fill="#8b1a1a" font-family="SimSun,serif" font-size="18">拾光育苗</text><text x="30" y="677" fill="#2c1810" font-family="Microsoft YaHei" font-size="11">成长有迹，心自成诗 · AI 生成诗文 / 封面设计示意</text></svg>`;let blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='拾光育苗-成长诗分享卡.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 SVG 分享卡设计图')}
document.addEventListener('click',e=>{const goEl=e.target.closest('[data-go]');if(goEl){if(goEl.dataset.go==='newlog'&&current==='detail')draft.kid=kidId;go(goEl.dataset.go,{kid:goEl.dataset.kid,poem:goEl.dataset.poem,log:goEl.dataset.log,vol:goEl.dataset.vol});return}const st=e.target.closest('[data-state]');if(st){saveDraft();if(taskTimer){clearTimeout(taskTimer);taskTimer=null}state=st.dataset.state;render();return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const d=e.target.closest('[data-dim]');if(d){dimension=Number(d.dataset.dim);let top=$('#scroll').scrollTop;render();$('#scroll').scrollTop=top;return}const pt=e.target.closest('[data-point]');if(pt){let i=Number(pt.dataset.point);$('#point-note').textContent=`2026 年 ${i+7} 月 · ${dims[dimension]} ${chartHistory(k())[i][dimension]} 分`;return}const t=e.target.closest('[data-type]');if(t){draft.type=t.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('active',x.dataset.type===draft.type));return}const rem=e.target.closest('[data-remove]');if(rem){imageUrls.splice(Number(rem.dataset.remove),1);$('#uploads').innerHTML=uploads();$('#image-count').textContent=imageUrls.length+'/3';return}const act=e.target.closest('[data-action]');if(act)action(act.dataset.action,act);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-point]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
$('#mobile-route').addEventListener('change',e=>go(e.target.value));$('#image-input').addEventListener('change',e=>{const files=[...e.target.files];if(files.length+imageUrls.length>3){modal('图片数量超出限制','最多添加 3 张，请重新选择。');e.target.value='';return}if(files.some(f=>!f.type.startsWith('image/')||f.size>5*1024*1024)){modal('图片暂时无法添加','请选择不超过 5MB 的图片。');e.target.value='';return}files.forEach(file=>imageUrls.push(URL.createObjectURL(file)));if($('#uploads')){$('#uploads').innerHTML=uploads();$('#image-count').textContent=imageUrls.length+'/3'}e.target.value='';});
if(meta[location.hash.slice(1)]){current=location.hash.slice(1);if(meta[current][1]!=='both')role=meta[current][1]}render();
</script>
